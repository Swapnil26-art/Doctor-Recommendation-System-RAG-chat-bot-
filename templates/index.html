<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MedBot — medical Q&A and nearby doctor recommendations.">
    <title>MedBot — Your Medical Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="chat-container">
        <header class="chat-header">
            <h1 class="title"><i class="fas fa-stethoscope" aria-hidden="true"></i> MedBot</h1>
            <p class="subtitle">Medical questions and nearby doctor recommendations</p>
            <button type="button" id="location-status" class="location-status pending"
                    title="Click to retry location access">
                <i class="fas fa-location-crosshairs" aria-hidden="true"></i>
                <span id="location-text">Getting your location…</span>
            </button>
        </header>

        <div id="chatbox" class="chatbox" role="log" aria-live="polite" aria-label="Conversation"></div>

        <p class="disclaimer">
            <i class="fas fa-circle-info" aria-hidden="true"></i>
            MedBot provides general information only and is not a substitute for professional medical advice.
        </p>

        <form id="chat-form" class="input-form" autocomplete="off">
            <label class="sr-only" for="user-input">Your question</label>
            <input type="text" id="user-input" name="msg" maxlength="1000"
                   placeholder="Ask a medical question, or find a doctor near me…" required>
            <button type="submit" id="send-button" aria-label="Send message">
                <i class="fas fa-paper-plane" aria-hidden="true"></i>
            </button>
        </form>
    </main>

    <script>
        "use strict";

        const form = document.getElementById("chat-form");
        const userInput = document.getElementById("user-input");
        const chatbox = document.getElementById("chatbox");
        const sendButton = document.getElementById("send-button");
        const locationButton = document.getElementById("location-status");
        const locationText = document.getElementById("location-text");

        let userLocation = null;

        /* ---------- Safe rendering helpers ----------
           Everything that reaches innerHTML has been escaped first, so neither
           user text nor third-party API data can inject markup. */

        const HTML_ESCAPES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, (ch) => HTML_ESCAPES[ch]);
        }

        function inlineFormat(text) {
            return text
                .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
                .replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, "$1<em>$2</em>")
                .replace(/`([^`]+)`/g, "<code>$1</code>");
        }

        function renderMarkdown(raw) {
            const lines = escapeHtml(raw).split(/\r?\n/);
            const html = [];
            let listItems = [];

            const flushList = () => {
                if (listItems.length) {
                    html.push("<ul>" + listItems.join("") + "</ul>");
                    listItems = [];
                }
            };

            for (const line of lines) {
                const bullet = line.match(/^\s*[-*+]\s+(.*)$/);
                const numbered = line.match(/^\s*\d+[.)]\s+(.*)$/);
                if (bullet || numbered) {
                    listItems.push("<li>" + inlineFormat(bullet ? bullet[1] : numbered[1]) + "</li>");
                    continue;
                }
                flushList();
                if (line.trim() === "") {
                    html.push("<br>");
                    continue;
                }
                html.push(inlineFormat(line) + "<br>");
            }
            flushList();
            return html.join("");
        }

        function scrollToBottom() {
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        function addMessage(role, contentHtml) {
            const bubble = document.createElement("div");
            bubble.className = role === "user" ? "user-message" : "bot-message";
            bubble.innerHTML = contentHtml;
            chatbox.appendChild(bubble);
            scrollToBottom();
            return bubble;
        }

        function addUserMessage(text) {
            addMessage("user", escapeHtml(text).replace(/\r?\n/g, "<br>"));
        }

        function addBotText(text, sources) {
            const bubble = addMessage("bot", renderMarkdown(text));
            addSources(bubble, sources);
            return bubble;
        }

        function addSources(bubble, sources) {
            if (!Array.isArray(sources) || sources.length === 0) return;

            const seen = new Set();
            const labels = [];
            sources.forEach((source) => {
                const page = source.page ? ", page " + source.page : "";
                const label = (source.source || "knowledge base") + page;
                if (!seen.has(label)) {
                    seen.add(label);
                    labels.push(label);
                }
            });

            const footer = document.createElement("div");
            footer.className = "sources";
            footer.textContent = "Source: " + labels.join(" · ");
            bubble.appendChild(footer);
        }

        function isSafeMapUrl(value) {
            try {
                const url = new URL(value);
                return url.protocol === "https:" && /(^|\.)google\.com$/.test(url.hostname);
            } catch (error) {
                return false;
            }
        }

        function addPlaceResults(data) {
            const wrapper = document.createElement("div");
            wrapper.className = "bot-message";

            const intro = document.createElement("p");
            intro.className = "places-intro";
            intro.textContent = data.intro || "Here are some places near you:";
            wrapper.appendChild(intro);

            (data.places || []).forEach((place) => {
                const card = document.createElement("div");
                card.className = "doctor-card";

                const name = document.createElement("strong");
                name.textContent = place.name;
                card.appendChild(name);

                const address = document.createElement("div");
                address.className = "doctor-meta";
                address.textContent = place.address;
                card.appendChild(address);

                const distance = document.createElement("div");
                distance.className = "doctor-meta";
                distance.textContent = place.distance_km + " km away";
                card.appendChild(distance);

                if (place.rating) {
                    const rating = document.createElement("div");
                    rating.className = "doctor-meta";
                    const count = place.user_ratings_total ? " (" + place.user_ratings_total + " reviews)" : "";
                    rating.textContent = "★ " + place.rating + count;
                    card.appendChild(rating);
                }

                if (isSafeMapUrl(place.map_url)) {
                    const link = document.createElement("a");
                    link.className = "map-link";
                    link.href = place.map_url;
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                    link.textContent = "View on map";
                    card.appendChild(link);
                }

                wrapper.appendChild(card);
            });

            chatbox.appendChild(wrapper);
            scrollToBottom();
        }

        /* ---------- Location ---------- */

        function setLocationState(state, message) {
            locationButton.className = "location-status " + state;
            locationText.textContent = message;
        }

        function requestLocation() {
            if (!navigator.geolocation) {
                setLocationState("error", "Location not supported — doctor search unavailable");
                return;
            }
            setLocationState("pending", "Getting your location…");
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    userLocation = position.coords.latitude + "," + position.coords.longitude;
                    setLocationState("ok", "Location ready — doctor search enabled");
                },
                () => {
                    userLocation = null;
                    setLocationState("error", "Location blocked — allow access to find doctors");
                },
                { timeout: 10000, maximumAge: 600000 }
            );
        }

        locationButton.addEventListener("click", requestLocation);

        /* ---------- Chat ---------- */

        function setBusy(busy) {
            sendButton.disabled = busy;
            userInput.disabled = busy;
        }

        function showLoading() {
            return addMessage("bot", '<span class="spinner" role="status" aria-label="Thinking"></span>');
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            addUserMessage(message);
            userInput.value = "";
            setBusy(true);
            const pending = showLoading();

            try {
                const response = await fetch("/get", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ msg: message, location: userLocation })
                });
                const data = await response.json().catch(() => null);
                pending.remove();

                if (!response.ok || !data) {
                    addBotText("Sorry, I'm having a connection issue. Please try again.");
                } else if (data.type === "places") {
                    addPlaceResults(data);
                } else {
                    addBotText(data.response || "Sorry, I couldn't process that.", data.sources);
                }
            } catch (error) {
                console.error("Request failed:", error);
                pending.remove();
                addBotText("Sorry, I'm having a connection issue. Please try again.");
            } finally {
                setBusy(false);
                userInput.focus();
            }
        });

        /* ---------- Boot ---------- */

        addBotText(
            "Hello! I'm MedBot. Ask me any medical question, or tell me what's wrong " +
            "and I'll look for a suitable doctor near you."
        );
        requestLocation();
    </script>
</body>
</html>
