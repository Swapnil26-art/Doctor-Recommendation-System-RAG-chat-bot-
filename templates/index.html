<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MedBot — medical Q&A and nearby doctor recommendations">
    <title>MedBot — Your Medical Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-shell">
        <!-- Chat Area - takes most space on left -->
        <main class="chat-main">
            <header class="header-bar">
                <div class="header-content">
                    <h1 class="header-title"><i class="fas fa-stethoscope me-2"></i> MedBot</h1>
                    <p class="header-sub">Medical questions and nearby doctor recommendations</p>
                </div>
                <button type="button" id="location-btn" class="loc-btn" aria-label="Get location">
                    <i class="fas fa-location-crosshairs"></i>
                </button>
            </header>

            <div class="chat-interface">
                <div class="message-area" id="chatbox" role="log" aria-live="polite"></div>
                <p class="disclaimer">
                    <i class="fas fa-circle-info me-2"></i>MedBot provides general information only and is not a substitute for professional medical advice.
                </p>
            </div>

            <form class="input-form" id="chat-form" autocomplete="off">
                <div class="input-wrapper">
                    <input type="text" id="user-input" name="msg" maxlength="1000"
                           placeholder="Ask a medical question, or find a doctor near me…" required>
                    <button type="submit" id="send-btn" aria-label="Send message">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </form>
        </main>

        <!-- Find Doctors Panel - fixed right side -->
        <div class="doctors-panel" id="doctors-panel">
            <div class="panel-header">
                <h3><i class="fas fa-search-heart"></i> Find Doctors</h3>
                <button type="button" class="panel-close" aria-label="Close panel">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="panel-body">
                <p class="panel-hint">Enter a condition or specialty</p>
                <input type="text" id="condition-input" class="cond-input" placeholder="e.g. cardiologist, chest pain, hospital">
                <button type="button" id="generate-btn" class="gen-btn">
                    <i class="fas fa-search me-2"></i>Generate
                </button>
            </div>
        </div>
    </div>

    <script>
    //<![CDATA[
    "use strict";

    // Element references
    const chatbox = document.getElementById("chatbox");
    const chatForm = document.getElementById("chat-form");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const locationBtn = document.getElementById("location-btn");
    const doctorsPanel = document.getElementById("doctors-panel");
    const panelClose = doctorsPanel.querySelector(".panel-close");
    const conditionInput = document.getElementById("condition-input");
    const generateBtn = document.getElementById("generate-btn");

    let userLocation = null;

    // Safe HTML rendering
    const HTML_ESCAPES = {
        "&": "&", "<": "<", ">": ">", '"': """, "'": "'"
    };

    function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (ch) => HTML_ESCAPES[ch]);
    }

    // Format markdown-like text
    function inlineFormat(text) {
        return text
            .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
            .replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, "$1<em>$2</em>")
            .replace(/`([^`]+)`/g, "<code>$1</code>");
    }

    function scrollToBottom() {
        chatbox.scrollTop = chatbox.scrollHeight;
    }

    function addMessage(role, contentHtml) {
        const bubble = document.createElement("div");
        bubble.className = role === "user" ? "user-bubble" : "bot-bubble";
        bubble.innerHTML = contentHtml;
        chatbox.appendChild(bubble);
        scrollToBottom();
        return bubble;
    }

    function addUserMessage(text) {
        addMessage("user", escapeHtml(text).replace(/\r?\n/g, "<br>"));
    }

    function addBotText(text, sources) {
        const bubble = addMessage("bot", inlineFormat(text));
        addSources(bubble, sources);
        return bubble;
    }

    function addSources(bubble, sources) {
        if (!Array.isArray(sources) || sources.length === 0) return;

        const seen = new Set();
        const labels = sources.map(s => {
            const page = s.page ? ", page " + s.page : "";
            const label = (s.source || "knowledge base") + page;
            if (!seen.has(label)) {
                seen.add(label);
                return label;
            }
            return null;
        }).filter(Boolean);

        const footer = document.createElement("div");
        footer.className = "message-sources";
        footer.textContent = "Source: " + labels.join(" · ");
        bubble.appendChild(footer);
    }

    // Location handling
    function setLocationState(state, message) {
        locationBtn.className = `loc-btn ${state}`;
        // Could add tooltip/title here
    }

    function requestLocation() {
        if (!navigator.geolocation) {
            setLocationState("error", "Location not supported — doctor search unavailable");
            return;
        }
        setLocationState("pending", "Getting your location…");
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const { latitude, longitude, accuracy } = position.coords;
                userLocation = latitude + "," + longitude;
                setLocationState("ok", "Location ready — doctor search enabled");
            },
            () => {
                userLocation = null;
                setLocationState("error", "Location blocked — allow access to find doctors");
            },
            { timeout: 10000, maximumAge: 600000 }
        );
    }

    // Chat form submission
    chatForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const message = userInput.value.trim();
        if (!message) return;

        addUserMessage(message);
        userInput.value = "";

        const pending = addBotText('<span class="spinner" role="status" aria-label="Thinking"></span>');

        try {
            const response = await fetch("/get", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ msg: message, location: userLocation })
            });
            const data = await response.json().catch(() => null);
            pending.remove();

            if (!data) {
                addBotText("Sorry, I'm having a connection issue. Please try again.");
            } else if (data.type === "places") {
                addPlaceResults(data);
            } else {
                addBotText(data.response || "Sorry, I couldn't process that.", data.sources);
            }
        } catch (error) {
            console.error("Request failed:", error);
            pending.remove();
            addBotText("Sorry, I'm having a connection issue. Please try again.");
        } finally {
            userInput.focus();
        }
    });

    // Panel toggle
    panelClose.addEventListener("click", () => {
        doctorsPanel.classList.add("panel-closed");
    });

    // Show panel when clicking location button (on mobile/ small screens)
    locationBtn.addEventListener("click", () => {
        requestLocation();
        // Toggle panel visibility on small screens
        if (window.innerWidth < 768) {
            doctorsPanel.classList.toggle("panel-visible");
        }
    });

    // Generate doctor search
    generateBtn.addEventListener("click", async () => {
        const condition = conditionInput.value.trim();
        if (!condition) return;

        // Add loading state
        const loading = addBotText('<span class="spinner" role="status" aria-label="Searching"></span>');

        try {
            const response = await fetch("/get", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ msg: condition, location: userLocation })
            });
            const data = await response.json().catch(() => null);
            loading.remove();

            if (!data) {
                addBotText("Sorry, I'm having a connection issue. Please try again.");
            } else if (data.type === "places") {
                addPlaceResults(data);
            } else {
                addBotText(data.response || "Sorry, I couldn't process that.", data.sources);
            }
        } catch (error) {
            console.error("Request failed:", error);
            loading.remove();
            addBotText("Sorry, I'm having a connection issue. Please try again.");
        }
    });

    // Render place results
    function addPlaceResults(data) {
        const wrapper = document.createElement("div");
        wrapper.className = "bot-bubble";

        const intro = document.createElement("p");
        intro.className = "places-intro";
        intro.textContent = data.intro || "Here are some places near you:";
        wrapper.appendChild(intro);

        (data.places || []).forEach((place) => {
            const card = document.createElement("div");
            card.className = "doctor-card";

            const name = document.createElement("strong");
            name.textContent = place.name;
            card.appendChild(name);

            const address = document.createElement("div");
            address.className = "doctor-meta";
            address.textContent = place.address;
            card.appendChild(address);

            const distance = document.createElement("div");
            distance.className = "doctor-meta";
            distance.textContent = place.distance_km + " km away";
            card.appendChild(distance);

            if (place.rating !== undefined) {
                const rating = document.createElement("div");
                rating.className = "doctor-meta";
                const count = place.user_ratings_total ? " (" + place.user_ratings_total + " reviews)" : "";
                rating.textContent = "★ " + place.rating + count;
                card.appendChild(rating);
            }

            if (place.map_url && place.map_url.startsWith("https://")) {
                const link = document.createElement("a");
                link.className = "map-link";
                link.href = place.map_url;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.textContent = "View on map";
                card.appendChild(link);
            }

            wrapper.appendChild(card);
        });

        chatbox.appendChild(wrapper);
        scrollToBottom();
    }

    // Start: request location on boot
    requestLocation();
    //]]>
    </script>

    <style>
    /* Color variables */
    :root {
        --brand: #2563eb;
        --brand-dark: #1d4ed8;
        --brand-light: #eff6ff;
        --success: #059669;
        --danger: #dc2626;
        --muted: #6b7280;
        --surface: #ffffff;
        --surface-dark: #f8fafc;
        --card: #ffffff;
        --border: #e5e7eb;
        --text: #111827;
        --text-secondary: #6b7280;
    }

    /* Page structure */
    .app-shell {
        display: flex;
        min-height: 100vh;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background-color: #f1f5f9;
        overflow-x: hidden;
    }

    /* Chat area */
    .chat-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        width: 0;
        max-width: calc(100% - 340px);
        background-color: #ffffff;
        border-left: 1px solid #e5e7eb;
    }

    .header-bar {
        padding: 0.875rem 1rem;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }

    .header-content {
        flex: 1;
    }

    .header-title {
        font-size: 1.125rem;
        font-weight: 600;
        color: #111827;
        display: flex;
        align-items: center;
        gap: 0.375rem;
        margin: 0;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #6b7280;
        margin: 0;
    }

    .loc-btn {
        padding: 0.5rem;
        border-radius: 9999px;
        background: #f1f5f9;
        border: none;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .loc-btn:hover {
        background: #e2e8f0;
    }

    .loc-btn:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
    }

    .chat-interface {
        flex: 1;
        padding: 0.875rem 1rem 0.5rem;
        overflow-y: auto;
        background: #f8fafc;
    }

    .message-area {
        min-height: 300px;
    }

    .disclaimer {
        margin-top: 0.75rem;
        padding-top: 0.75rem;
        border-top: 1px solid #e5e7eb;
        font-size: 0.75rem;
        color: #6b7280;
        display: flex;
        align-items: center;
    }

    .input-form {
        padding: 0.875rem 1rem;
        background: #ffffff;
        border-top: 1px solid #e5e7eb;
        display: flex;
        gap: 0.625rem;
    }

    .input-wrapper {
        flex: 1;
        display: flex;
        gap: 0.5rem;
    }

    .input-wrapper input {
        flex: 1;
        padding: 0.625rem 0.875rem;
        border: 1px solid #d1d5db;
        border-radius: 0.5rem;
        font-size: 0.875rem;
        font-family: inherit;
        outline: none;
        transition: border-color 0.2s;
    }

    .input-wrapper input:focus {
        border-color: #2563eb;
    }

    .input-wrapper button {
        padding: 0 1rem;
        background: #2563eb;
        color: #ffffff;
        border: none;
        border-radius: 0.5rem;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
    }

    .input-wrapper button:hover {
        background: #1d4ed8;
    }

    .input-wrapper button:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
    }

    /* Doctors panel */
    .doctors-panel {
        position: fixed;
        right: 0;
        top: 0;
        bottom: 0;
        width: 340px;
        background-color: #ffffff;
        border-left: 1px solid #e5e7eb;
        z-index: 100;
        display: flex;
        flex-direction: column;
        box-shadow: -4px 0 12px rgba(0,0,0,0.05);
        transform: translateX(0);
        transition: transform 0.3s ease;
    }

    .doctors-panel.panel-closed {
        transform: translateX(100%);
    }

    .doctors-panel.panel-visible {
        z-index: 100;
    }

    .panel-header {
        padding: 0.875rem 1rem;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .panel-header h3 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
        color: #111827;
    }

    .panel-close {
        padding: 0.25rem;
        background: none;
        border: none;
        color: #6b7280;
        cursor: pointer;
        font-size: 1.25rem;
        transition: color 0.2s;
    }

    .panel-close:hover {
        color: #dc2626;
    }

    .panel-body {
        flex: 1;
        padding: 0.875rem 1rem;
        overflow-y: auto;
    }

    .panel-hint {
        font-size: 0.75rem;
        color: #6b7280;
        margin-bottom: 0.75rem;
        display: block;
    }

    .cond-input {
        width: 100%;
        padding: 0.625rem 0.875rem;
        border: 1px solid #d1d5db;
        border-radius: 0.5rem;
        font-size: 0.875rem;
        font-family: inherit;
        outline: none;
        margin-bottom: 0.625rem;
    }

    .cond-input:focus {
        border-color: #2563eb;
    }

    .gen-btn {
        width: 100%;
        padding: 0.625rem;
        background: #2563eb;
        color: #ffffff;
        border: none;
        border-radius: 0.5rem;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
    }

    .gen-btn:hover {
        background: #1d4ed8;
    }

    .gen-btn:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
    }

    /* Doctor cards (from place results) */
    .doctor-card {
        padding: 0.75rem 1rem;
        background: #ffffff;
        border-radius: 0.5rem;
        border: 1px solid #f3f4f6;
        margin-top: 0.5rem;
    }

    .doctor-card strong {
        color: #111827;
        font-weight: 600;
    }

    .doctor-meta {
        font-size: 0.75rem;
        color: #6b7280;
        margin-top: 0.25rem;
    }

    .map-link {
        display: inline-block;
        margin-top: 0.5rem;
        padding: 0.375rem 0.75rem;
        background: #2563eb;
        color: #ffffff;
        text-decoration: none;
        border-radius: 0.5rem;
        font-size: 0.75rem;
        font-weight: 500;
        transition: background 0.2s;
    }

    .map-link:hover {
        background: #1d4ed8;
    }

    /* Loading spinner */
    .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid #e5e7eb;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        display: inline-block;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    /* Bubbles */
    .user-bubble, .bot-bubble {
        margin: 0.5rem 0;
        padding: 0.75rem 1rem;
        border-radius: 0.75rem;
        max-width: 85%;
        line-height: 1.5;
    }

    .user-bubble {
        background: #dcfce7;
        margin-left: auto;
        border-bottom-right-radius: 4px;
    }

    .bot-bubble {
        background: #f8fafc;
        color: #111827;
        margin-right: auto;
        border-bottom-left-radius: 4px;
    }

    .message-sources {
        margin-top: 0.375rem;
        font-size: 0.6875rem;
        color: #6b7280;
        padding-top: 0.25rem;
        border-top: 1px dashed #e5e7eb;
    }

    /* Mobile responsiveness */
    @media (max-width: 768px) {
        .app-shell {
            flex-direction: column-reverse;
        }

        .chat-main {
            max-width: 100%;
            border-left: none;
            border-top: 1px solid #e5e7eb;
            border-bottom: 1px solid #e5e7eb;
        }

        .doctors-panel {
            position: relative;
            width: 100%;
            border-left: none;
            border-top: 1px solid #e5e7eb;
        }

        .doctors-panel.panel-closed {
            transform: translateX(0);
        }

        .doctors-panel.panel-visible {
            display: block;
        }
    }
    </style>
</body>
</html>
